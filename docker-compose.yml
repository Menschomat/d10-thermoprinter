version: '3.8'

services:
  thermoprinter:
    image: menschomat/d10-thermoprinter:main
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PRINTER_DEVICE=/dev/usb/lp0
      - PRINTER_DELAY_MS=500
      - PRINTER_BLANK_LINES=4
      - PRINTER_MAX_BYTES=10240
      - PRINTER_MAX_TEXT_LENGTH=1000
    # The device mapping below is important to access the host's usb device.
    # It maps the host device to the container device.
    devices:
      - "/dev/usb/lp0:/dev/usb/lp0"
    # Provide the container user (appuser) with supplemental access 
    # to the host's lp group (GID 7) for printer device permissions.
    group_add:
      - "7"
    restart: unless-stopped
