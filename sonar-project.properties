sonar.projectKey=Menschomat_d10-thermoprinter
sonar.organization=menschomat


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=d10-thermoprinter
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Path to coverage reports
sonar.go.coverage.reportPaths=coverage.out

# Exclude files from coverage
sonar.coverage.exclusions=**/*.yml,**/*_test.go,**/main.go

# Exclude test files and entry point from duplication (CPD) analysis.
# Test files intentionally repeat boilerplate patterns across test cases.
sonar.cpd.exclusions=**/*_test.go